<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>无敌跳字预览</title>
<link rel="stylesheet" href="style.css">
<style>
html,body{margin:0;width:100%;height:100%;overflow:auto;background:#0b1220;color:#e5f3ff;font-family:"Microsoft YaHei",sans-serif}body{display:grid;place-items:center;padding:24px;box-sizing:border-box}.lab{width:min(100%,560px)}h1{font-size:23px;margin:0 0 10px}p{font-size:14px;color:#9eafc4;line-height:1.7}.stage{height:380px;position:relative;overflow:hidden;border:1px solid #29465c;border-radius:18px;background:radial-gradient(ellipse at 50% 65%,#19384a,transparent 65%),repeating-linear-gradient(0deg,transparent 0 39px,#22324666 40px),repeating-linear-gradient(90deg,#0d1828 0 39px,#22324666 40px)}.actor{position:absolute;width:28px;height:43px;border:2px solid #a3fff1;border-radius:10px;background:#1a8e87;box-shadow:0 0 24px #39ffcf66;transform:translate(-50%,-50%)}.actor:after{content:'••';position:absolute;top:3px;left:5px;color:white;letter-spacing:4px}.controls{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0}button{position:static;width:auto;height:auto;padding:10px 16px;border:1px solid #426278;border-radius:8px;background:#1c3448;color:white;font:inherit;cursor:pointer}label{display:flex;align-items:center;gap:6px;font-size:14px}.phase{font-size:13px;color:#a3bfd0;min-height:24px}.cash-popup.bomb-name-popup{z-index:3}
#effect-canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;border-radius:18px}.actor{z-index:1}</style>
<main class="lab"><h1>无敌跳字预览</h1><p>每 60 毫秒黄蓝交替，最后 0.3 秒回黄淡出。护盾匀速飞入，拾取后播放圆柱光幕与拉长收细的中心光柱。拖动场景可移动角色。</p><div class="stage" id="stage"><canvas id="effect-canvas"></canvas><div class="actor" id="actor"></div><img id="pickup" src="assets/pickup-shield-blue-border.png" alt="护盾掉落" style="position:absolute;width:52.8px;height:52.8px;display:none;pointer-events:none;transform:translate(-50%,-50%);"><div class="cash-popups"><span id="cue" class="cash-popup bomb-name-popup">无敌2秒！</span></div></div><div class="controls"><label>掉落类型 <select id="kind"><option value="shield">无敌护盾</option><option value="health">生命回复 +1</option></select></label><button id="replay">重新播放</button><button id="pause">暂停</button><label><input type="checkbox" id="loop" checked>循环播放</label><label><input type="checkbox" id="sound">奖励音效</label></div><div id="phase" class="phase"></div></main>
<script src="renderer.js"></script>
<script>
const cue=document.getElementById('cue'),stage=document.getElementById('stage'),actor=document.getElementById('actor'),phase=document.getElementById('phase');let age=-1.8,last=performance.now(),paused=false,x=.5,y=.7,audio;
function reward(){if(!document.getElementById('sound').checked)return;audio??=new AudioContext();audio.resume();const start=audio.currentTime;[523.25,659.25,783.99,1046.5,1318.51].forEach((f,i)=>{const t=start+i*.075,o=audio.createOscillator(),g=audio.createGain();o.type='triangle';o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(.001,t);g.gain.linearRampToValueAtTime(.075,t+.012);g.gain.exponentialRampToValueAtTime(.001,t+.32);o.connect(g);g.connect(audio.destination);o.start(t);o.stop(t+.33)})}
function restart(){age=-1.8;flightX=.12;flightY=.3}
document.getElementById('replay').onclick=()=>{restart();paused=false;document.getElementById('pause').textContent='暂停'};document.getElementById('pause').onclick=e=>{paused=!paused;e.target.textContent=paused?'继续':'暂停'};document.getElementById('sound').onchange=()=>reward();
function move(e){const b=stage.getBoundingClientRect();x=Math.max(.08,Math.min(.92,(e.clientX-b.left)/b.width));y=Math.max(.4,Math.min(.9,(e.clientY-b.top)/b.height))}stage.style.touchAction='none';stage.onpointerdown=e=>{stage.setPointerCapture(e.pointerId);move(e)};stage.onpointermove=e=>{if(e.buttons)move(e)};
const effectRenderer=new Elevator3D(document.getElementById('effect-canvas'));effectRenderer.cameraScale=.28;effectRenderer.backgroundColor=[.045,.075,.11];
let flightX=.12,flightY=.3,flightClock=0;
document.getElementById('kind').onchange=()=>restart();
function frame(now){
 const health=document.getElementById('kind').value==='health';
 const dt=paused?0:Math.min(.05,(now-last)/1000),previousAge=age;last=now;
 flightClock+=dt;effectRenderer.begin();
 const r=effectRenderer,hx=r.halfX,hy=r.halfY;
 if(!paused){
  if(age<0){
   const dx=(x-flightX)*2*hx,dy=(y-flightY)*2*hy,d=Math.hypot(dx,dy),travel=178.125*dt;
   if(d<=travel+30){flightX=x;flightY=y;age=0;reward();}else{flightX+=dx/d*travel/(2*hx);flightY+=dy/d*travel/(2*hy);age+=dt*.000001;}
  }else age+=dt;
 }
 if(age>1.8&&document.getElementById('loop').checked){restart();flightX=.12;flightY=.3;}
 const px=(x-.5)*2*hx,pz=((y*380+20)/380-.5)*2*hy/.84663655;
 if(age<0){
  const xx=(flightX-.5)*2*hx,zz=(flightY-.5)*2*hy/.84663655;
  r.shieldPickupHalo(xx,0,zz,flightClock,health);const pt=(u,v)=>[xx+(u-.5)*60,(.5-v)*60*.53217155,zz-(.5-v)*60*.84663655,u,v];
  r.imageQuad(health?'assets/pickup-health-green.png':'assets/pickup-shield-blue-border.png',[pt(0,0),pt(1,0),pt(1,1),pt(0,1)]);
 }
 if(age>=0&&age<.25)r.shieldPickupEffect(px,0,pz,age/.25,health);
 r.end();
 const blue=age<.85&&Math.floor(age/.06)%2,alpha=Math.min(1,Math.max(0,(1.15-age)/.3)),scale=1+.16*Math.exp(-Math.max(0,age)*10);
 cue.textContent=health?'生命 +1！':'无敌2秒！';cue.style.setProperty('color',health?(blue?'#d4ff8c':'#52ef85'):blue?'#45aaff':'#ffd45c','important');cue.style.opacity=age<0?0:alpha;cue.style.left=x*100+'%';cue.style.top=(y*380-62)+'px';cue.style.transform=`translate(-50%,-100%) translateY(0px) scale(${scale})`;actor.style.left=x*100+'%';actor.style.top=y*100+'%';phase.textContent=age<0?'匀速飞入 · 旋转背光':age>=1.15?'播放结束':age>=.85?'回到黄色 · 淡出':blue?'蓝色 · 快速闪色':'黄色 · 快速闪色';requestAnimationFrame(frame);
}requestAnimationFrame(frame);
</script></html>
