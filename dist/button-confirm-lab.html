<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>闪烁按钮调试台</title><link rel="stylesheet" href="fonts.css"><link rel="stylesheet" href="ui-motion.css"><style>
*{box-sizing:border-box}body{margin:0;background:#10101b;color:#efedf8;font:16px/1.6 system-ui}main{width:min(920px,100%);margin:auto;padding:32px 20px}h1{margin:0;font-size:28px}p{color:#aaa7c1}.layout{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:24px}.card{padding:24px;background:#1d1b30;border:1px solid #49415f;border-radius:12px}label{display:block;margin-bottom:22px}label span{display:block;margin-bottom:8px}input[type=range]{width:100%;accent-color:#b6a0ff}input[type=number]{width:100px;background:#10101b;border:1px solid #716589;color:white;padding:8px;border-radius:4px;font:inherit}button,a{font:inherit}button{padding:12px 18px;background:#594089;color:white;border:1px solid #ad8ce5;border-radius:6px;cursor:pointer}button:disabled{opacity:.5}.preview{min-height:190px;display:grid;place-items:center;background:#11101e;border-radius:8px}#preview{background:linear-gradient(120deg,#8960dd,#51388b);font-weight:800;min-width:190px;font-size:22px;border-radius:0;padding:20px}#result{min-height:55px;color:#f8cf79}#summary{color:#c7b7eb}.actions{display:flex;flex-wrap:wrap;gap:10px}a{color:#c6acff}small{color:#aaa7c1}@media(max-width:650px){.layout{grid-template-columns:1fr}main{padding-top:20px}.card{padding:18px}}
</style></head><body><main><a href="/">← 返回游戏</a><h1>闪烁按钮调试台</h1><p>拖动或输入数值，再点击预览。满意后保存，正式按钮会使用同一套参数。</p><div class="layout"><section class="card"><div id="controls"></div><div class="actions"><button id="save">保存到游戏</button><button id="reset">恢复默认</button></div><p id="saved" role="status"></p><small>参数保存在当前浏览器。已打开的同源游戏页面会同步更新。</small></section><section class="card"><h2>实际按钮预览</h2><div class="preview"><button id="preview" data-confirm-delay>确认升级 ＋</button></div><p id="summary"></p><p id="result" role="status">点击预览：先闪烁，结束后响起上扬提示音。</p><button id="chime">试听完成音效 ♪</button><p><small>预览期间锁定操作，与游戏一致。系统开启减少动态效果时不闪烁。</small></p></section></div></main><script src="ui-motion.js"></script><script src="button-confirm-lab.js"></script></body></html>
