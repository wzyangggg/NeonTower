<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>彩虹盒子 · 空场景</title><style>*{box-sizing:border-box}body{margin:0;background:#24262b;color:#eee;font:14px system-ui}canvas{display:block;width:100vw;height:100dvh;touch-action:none}header{position:absolute;top:24px;left:28px;pointer-events:none}h1{font-size:20px;margin:0 0 8px}p{color:#aeb4c3;margin:0}aside{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);display:flex;gap:16px;align-items:center;padding:14px 18px;border:1px solid #ffffff20;border-radius:12px;background:#191c23dc;width:max-content;max-width:min(95vw,1000px);max-height:38dvh;overflow:auto;flex-wrap:wrap;justify-content:center}label{display:flex;gap:8px;align-items:center;white-space:nowrap}input[type=range]{width:90px}output{min-width:40px;font-variant-numeric:tabular-nums}button{background:#353b4a;color:white;border:1px solid #ffffff30;padding:7px 12px;border-radius:6px;cursor:pointer}#error{position:absolute;top:100px;color:#ffb4b4}</style><canvas id="scene" aria-label="可拖动旋转的彩虹盒子"></canvas><header><h1>彩虹盒子</h1><p>空场景材质预览 · 拖动旋转 / 滚轮缩放</p></header><aside><label>流速<input id="speed" type="range" min="0" max="1" step=".01" value=".15"></label><label>流光 Scale<input id="flow-scale" type="range" min=".1" max="6" step=".05" value="1"><output for="flow-scale">1.00×</output></label><label>Rim 范围<input id="rim-scale" type="range" min=".1" max="4" step=".05" value="1"><output for="rim-scale">1.00×</output></label><label>Rim 强度<input id="rim-strength" type="range" min="0" max="3" step=".05" value="1"><output for="rim-strength">1.00×</output></label><label>波点<input id="dots" type="range" min="3" max="12" step="1" value="3"></label><label>白光强度<input id="white" type="range" min="0" max="3" step=".05" value="1"><output id="white-value" for="white">1.00×</output></label><label><input id="shine" type="checkbox" checked>白光</label><label><input id="back-light" type="checkbox" checked>背面受光</label><button id="pause">暂停</button><button id="reset">重置视角</button><span id="save-status" role="status" style="color:#aeb4c3;font-size:12px">参数自动保存并同步游戏</span></aside><p id="error" role="alert"></p><script src="rainbow-box-lab.js"></script></html>
