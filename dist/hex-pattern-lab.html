<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>六边形 · 连续线路实验</title><style>
*{box-sizing:border-box}body{margin:0;background:#090e15;color:#dce8ef;font:14px/1.6 system-ui,sans-serif}header{padding:24px 32px;border-bottom:1px solid #25323e;display:flex;align-items:center;justify-content:space-between;gap:20px}h1{font-size:22px;margin:3px 0;font-weight:550}small,.muted{color:#8196a6}small{letter-spacing:3px}main{display:grid;grid-template-columns:280px 1fr;min-height:calc(100vh - 105px)}aside{padding:26px;border-right:1px solid #25323e}label{display:block;margin:0 0 22px}input:not([type=checkbox]),select{width:100%;margin-top:8px}input[type=text],select,button{background:#15222e;border:1px solid #344655;border-radius:5px;color:#dce8ef;padding:9px;font:inherit}input[type=range]{accent-color:#78d7c2}button{cursor:pointer}button:hover{border-color:#78d7c2}button.primary{background:#78d7c2;color:#0a2422;border:0;width:100%;margin-bottom:12px}article{padding:24px;min-width:0}.board{background:radial-gradient(ellipse at center,#14212c,#0b111a);border:1px solid #25323e;border-radius:8px;overflow:hidden}.tile,.ghost{cursor:pointer}.ghost:hover{fill:#538d8a;fill-opacity:.6}.tile:hover>polygon{stroke:#b9fff0}svg{display:block;width:100%;height:auto;max-height:74vh}#stats{padding:12px 16px;border-top:1px solid #25323e;font-size:12px;color:#9bb3c2}.note{max-width:850px;color:#8196a6;margin-top:16px}output{float:right;color:#78d7c2}@media(max-width:700px){header{padding:18px}main{display:flex;flex-direction:column}aside{border-right:0;border-bottom:1px solid #25323e;padding:18px;display:grid;grid-template-columns:1fr 1fr;gap:12px}label{margin:0}article{padding:12px}aside p{display:none}svg{max-height:none}h1{font-size:19px}}
</style><header><div><small>SURFACE STUDY / 01</small><h1>六边形 · 连续线路</h1></div><span class="muted">立体地块 / 连续花纹 / 近景对照</span></header><main><aside><label>点击操作<select id="editMode"><option value="terrain">增删地块</option><option value="tower">放置 / 移除芯片塔</option></select></label><button id="demoTower">查看中心芯片塔</button><label>预览范围<select id="scope"><option value="detail">19 块地块 · 近看装饰</option><option value="all">143 块地块 · 查看全图</option></select></label><label>地图种子<input id="seed" type="text" value="elevator-circuit-01"></label><label>花纹覆盖率 <output id="densityValue"></output><input id="density" type="range" min="0" max="100" value="45"></label><label>断续六边形 <output id="outlineValue"></output><input id="outline" type="range" min="0" max="100" value="65"></label><label>线宽 <output id="widthValue"></output><input id="width" type="range" min="0.4" max="2" step="0.1" value="0.6"></label><label>表面颜色<select id="palette"><option value="mint">冷青铜 / 深蓝板面</option><option value="gold">哑金 / 石墨板面</option><option value="grey">灰白 / 深色板面</option></select></label><label><input id="seams" type="checkbox" checked> 显示地块缝隙</label><label><input id="tilt" type="checkbox" checked> 立体地块预览</label><label><input id="flow" type="checkbox" checked> 线路流光</label><label>流动速度 <output id="speedValue"></output><input id="speed" type="range" min="0.3" max="2.5" step="0.1" value="1"></label><label><input id="pattern" type="checkbox" checked> 显示表面花纹</label><button class="primary" id="generate">换一个种子</button><button id="resetMap">重置地图</button><button id="export">导出 SVG</button><p class="muted">默认近看 19 块立体地块。关闭表面花纹可对比装饰前后；切换全图检查线路接续。</p></aside><article><div class="board"><div id="view"></div><div id="stats"></div></div><p class="note">切换“放置 / 移除芯片塔”后点击地块：六边形芯片从六侧引脚向周围一圈地块发散线路；缺少邻居时在本块收尾。覆盖率决定普通花纹的地块比例，其余留白；相邻的花纹地块自动衔接。点击实心地块删除，点击周围虚线格添加。花纹由种子和坐标决定，增删仅影响直接相邻的地块；底部显示变化与保持原样的格子数。删成多座岛时，各岛独立连通。</p></article></main><script src="hex-pattern-lab.js"></script></html>
